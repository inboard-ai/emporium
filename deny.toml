[advisories]
unmaintained = "workspace"
yanked = "warn"
# No ignores: the wasmtime 44 bump moved off the old rustls 0.22 stack and
# patched wasmtime-wasi, clearing the whole cluster. Keep empty.
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    # wasmtime 43.0 -> wasm-compose -> im-rc -> sized-chunks (MPL-2.0+).
    # MPL-2.0 is OSI-approved and compatible with MIT projects.
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
