[advisories]
unmaintained = "workspace"
yanked = "warn"
# All pinned by the wasmtime 43.0 stack; no fix without an upstream wasmtime
# bump (44.x). Remove when wasmtime updates. 0049/0104/0098/0099: rustls-webpki
# 0.102.8 via wasmtime-wasi-http 43.0 -> tokio-rustls 0.25 -> rustls 0.22.
# 0149: wasmtime-wasi path_open(TRUNCATE) write-perm bypass; no 43.x fix, and
# not reachable here (extensions get no writable WASI preopens).
ignore = [
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    "RUSTSEC-2026-0149",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    # wasmtime 43.0 -> wasm-compose -> im-rc -> sized-chunks (MPL-2.0+).
    # MPL-2.0 is OSI-approved and compatible with MIT projects.
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
