[advisories]
unmaintained = "workspace"
yanked = "warn"
# rustls-webpki 0.102.8 pinned by wasmtime 43.0 -> tokio-rustls 0.25 -> rustls 0.22.
# Tracked upstream; remove this ignore when wasmtime bumps its rustls stack.
ignore = ["RUSTSEC-2026-0049"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    # wasmtime 43.0 -> wasm-compose -> im-rc -> sized-chunks (MPL-2.0+).
    # MPL-2.0 is OSI-approved and compatible with MIT projects.
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
