[advisories]
unmaintained = "workspace"
yanked = "warn"
# wasmtime 27.x has two CVEs with no patch in this major version.
# Needs upgrade to >=34.0.2 — tracked separately.
ignore = ["RUSTSEC-2025-0046", "RUSTSEC-2025-0118"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
