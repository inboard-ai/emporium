[package]
name = "databench-extension"
version = "0.1.0"
edition = "2024"
publish = false

# Detach from the emporium workspace — this crate builds for wasm32-wasip1 via
# `cargo component`, not as a host workspace member.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1.0"
wit-bindgen = "0.51"
# Lightweight Arrow stack (NOT polars) — this is the R1c guest encode path.
# default-features = false keeps the wasm small; proven to target wasm32-wasip1.
arrow-array = { version = "55", default-features = false }
arrow-ipc = { version = "55", default-features = false }
arrow-schema = { version = "55", default-features = false }

[package.metadata.component.target]
path = "wit"
world = "databench"

[profile.release]
opt-level = 3
