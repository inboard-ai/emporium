[package]
name = "kv-extension"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = "0.51"
# Guest toolkit: typed Frame builder over the Arrow IPC data wire. Wraps
# arrow-rs so this extension never names it directly.
emporium-sdk = { path = "../../../sdk" }

[package.metadata.component.target]
path = "wit"
world = "full-extension"
