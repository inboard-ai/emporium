[package]
name = "kv-extension"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
emporium-core = { git = "https://github.com/inboard-ai/emporium.git" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = "0.35"

# For local development - remove when using published emporium
[patch."https://github.com/inboard-ai/emporium.git"]
emporium-core = { path = "../../../core" }
