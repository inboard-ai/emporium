[package]
name = "kv-extension"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = "0.51"

[package.metadata.component.target]
path = "wit"
world = "block-extension"
