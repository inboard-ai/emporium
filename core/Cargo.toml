[package]
name = "emporium-core"
description = "Core data types for the Emporium extension framework"
version = "0.0.1"
edition = "2024"
authors = ["Andy Terra <tech@andyterra.com>"]
license = "MIT"

[dependencies]
emporium-types.workspace = true
# `dtype-date` compiles in the Date logical type (i32 days) so the IPC reader can
# build a Date series from a guest's native Arrow Date32 column (R2c temporal).
polars-core = { version = "0.51", default-features = false, features = ["dtype-date"] }
# IPC (Arrow) codec for the data-frame wire format. `ipc` is the only feature
# we need; default-features off keeps the dependency surface tight.
polars-io = { version = "0.51", default-features = false, features = ["ipc"] }
serde = { version = "1.0.208", features = ["serde_derive"] }
serde_json = "1.0.125"
thiserror = "1.0.63"
