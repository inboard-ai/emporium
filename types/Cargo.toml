[package]
name = "emporium-types"
description = "Shared types for the Emporium extension ecosystem"
version = "0.0.1"
edition = "2024"
authors = ["Andy Terra <tech@andyterra.com>"]
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["serde_derive"] }
serde_json = "1.0"
ts-rs = { version = "12", features = ["serde-json-impl"], optional = true }

[features]
ts = ["dep:ts-rs"]
